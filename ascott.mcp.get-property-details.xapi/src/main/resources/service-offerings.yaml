# T-03 get_service_offerings (get-service-offerings.xml)
# Append to the environment YAML, in the same style as the existing t02 block.
# get-service-offerings.xml has no defaults and no config of its own: it uses HTTP_Listener and
# Property_Info_HTTP from global-config.xml, so it adds no listener or request config.

# ---------- New keys: only this endpoint uses them
t03:
  http.path: "/api/v1/service-offerings"
  defaultlanguage: "en"                          # when the request has no language (lower case: en, zh-CN)
  assetbaseurl: "https://www.discoverasr.com"    # meta.asset_base_url; also prefixes site-relative facilityUrl

# ---------- Shared with T-02 get_property_details
# T-03 calls the process API through get_property_details' own get-property-info sub-flow, so it uses exactly the
# same request config, credentials, app.version / app.channel and default.* keys. Nothing else to add for it.
