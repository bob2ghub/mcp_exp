# HTTP listener (non-logged-in journey: no auth, no user context)
http.host=0.0.0.0
http.port=8083
http.path=/api/v1/property-details

# Sent as "version" and "channel" on every downstream request
app.version=v1
app.channel=mcp

# Property details process API (PRD T-02 sources: getpropertyinfo, bookingsearchresultv2, v1/propertyreviews).
# ASSUMED endpoint: same mocking link as the POI API. Replace with the real property-details URL.
property.protocol=HTTPS
property.host=anypoint.mulesoft.com
property.port=443
property.basePath=/mocking/api/v1/links/7f9e4e4b-5b60-4ba7-9a80-8c260eaa9eed
property.path=/getpropertydetails
property.clientId=25617
property.clientSecret=625252
property.timeout=8000

# Property POI API
poi.protocol=HTTPS
poi.host=anypoint.mulesoft.com
poi.port=443
poi.basePath=/mocking/api/v1/links/7f9e4e4b-5b60-4ba7-9a80-8c260eaa9eed
poi.path=/getpropertypois
poi.clientId=25617
poi.clientSecret=625252
poi.timeout=5000
# Schema caps nearby[] at 5
poi.maxPerProperty=5
# Used only when a POI has distanceMetres but no distanceMinutes (about 4.8 km/h)
poi.walkingMetresPerMinute=80

# Request defaults, applied when the tool call leaves a field out
default.language=en
default.currency=SGD
default.adults=1
default.children=0
default.checkinOffsetDays=1
default.nights=1

# Request limits
request.maxAdults=10
request.maxChildren=10
request.maxNights=90

# Origin the widget resolves relative image paths against
asset.baseUrl=https://www.discoverasr.com
