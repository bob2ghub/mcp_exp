# Keys mcp-tool.xml needs for the four tools that call the ODX backend experience API
# (Mule app asc-mcp-odx-backend-xapi). Append these to application_properties.yaml.
# That listener has no auth, so no client id or secret belongs here.

xapi:
  protocol: "HTTP"                                       # the xAPI listener is plain HTTP on CloudHub
  host: "asc-mcp-odx-backend-xapi-1.sg-s1.cloudhub.io"   # CONFIRM: use the mule-worker-internal host if both apps share a VPC
  port: "80"                                             # 80 for the public CloudHub URL; 8081 for mule-worker-internal-*
  timeout: "30000"

  # Paths must match the xAPI's own listeners. T-03 and T-06 are ${t03.http.path} / ${t06.http.path} there.
  propertydetails.path: "/api/v1/property-details"       # T-02 get_property_details
  serviceofferings.path: "/api/v1/service-offerings"     # T-03 getServiceOfferings
  roomdetails.path: "/api/v1/room-details"               # T-04 getRoomAndRateDetails
  compareproperties.path: "/api/v1/compare-properties"   # T-06 compareProperties
